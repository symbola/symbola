name: Release

on:
  push:
    branches: [effect]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository == 'symbola/symbola'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Upgrade npm for provenance support
        run: npm install --global npm@latest

      - name: Check
        run: pnpm run check

      - name: Publish
        run: pnpm run changeset-publish
        env:
          NPM_CONFIG_PROVENANCE: true
