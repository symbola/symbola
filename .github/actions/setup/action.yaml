name: Setup
description: Install Node, pnpm, and workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        cache: pnpm
        node-version: latest

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
